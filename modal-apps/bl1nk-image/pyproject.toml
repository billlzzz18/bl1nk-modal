[project]
name = "bl1nk-image"
version = "1.0.0"
description = "Image generation MCP service on Modal with memory registry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=0.70.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "aiofiles>=23.0",
    "python-multipart>=0.0.6",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "torch>=2.2",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.28.1",
    "ruff>=0.12.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["image_service"]
