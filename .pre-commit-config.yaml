repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-bl1nk-app
        name: ruff (bl1nk-app)
        entry: bash -c 'cd modal-apps/bl1nk-app && ruff check . && ruff format --check .'
        language: system
        pass_filenames: false
        files: ^modal-apps/bl1nk-app/
      - id: ruff-modal-images
        name: ruff (modal-images)
        entry: bash -c 'cd modal-images && ruff check . && ruff format --check .'
        language: system
        pass_filenames: false
        files: ^modal-images/
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd modal-apps/bl1nk-app/engine && cargo fmt --check'
        language: system
        pass_filenames: false
        files: ^modal-apps/bl1nk-app/engine/
      - id: cargo-test
        name: cargo test
        entry: bash -c 'cd modal-apps/bl1nk-app/engine && cargo test --all'
        language: system
        pass_filenames: false
        files: ^modal-apps/bl1nk-app/engine/
